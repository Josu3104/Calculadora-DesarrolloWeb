<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div class="calculator-container"
        style="width: 300px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
        <div class="screen">
            <input type="text" class="screen-input"
                style="width: 100%; height: 50px; font-size: 24px; text-align: right;" readonly>
        </div>
        <div class="operands" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
            <button class="operand">+</button>
            <button class="operand">-</button>
            <button class="operand">*</button>
            <button class="operand">/</button>
        </div>
        <div class="numpad" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">

            <button class="num">1</button>
            <button class="num">1</button>
            <button class="num">1</button>
            <button class="num">1</button>
            <button class="num">1</button>
            <button class="num">1</button>
            <button class="num">1</button>
            <button class="num">1</button>
            <button class="num">1</button>

        </div>
    </div>

</body>

</html>
