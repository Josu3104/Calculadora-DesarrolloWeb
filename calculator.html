<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator-wrapper">
        <div class="calculator-container">

            <div class="calculator-screen">
                <div class="screen-main" id="display">0</div>
            </div>

            <div class="paren-row">
                <button type="button" class="calc-btn btn-op btn-paren" onclick="mostrar(abrirParentesis())">(</button>
                <button type="button" class="calc-btn btn-op btn-paren" onclick="mostrar(cerrarParentesis())">)</button>
            </div>

            <div class="buttons-grid">
                <button type="button" class="calc-btn btn-clear" onclick="mostrar(limpiar())">C</button>
                <button type="button" class="calc-btn btn-op" onclick="mostrar(agregarOperador('/'))">&divide;</button>
                <button type="button" class="calc-btn btn-op" onclick="mostrar(agregarOperador('*'))">&times;</button>
                <button type="button" class="calc-btn btn-op" onclick="mostrar(agregarOperador('-'))">&minus;</button>

                <button type="button" class="calc-btn btn-num" onclick="mostrar(agregarNumero('7'))">7</button>
                <button type="button" class="calc-btn btn-num" onclick="mostrar(agregarNumero('8'))">8</button>
                <button type="button" class="calc-btn btn-num" onclick="mostrar(agregarNumero('9'))">9</button>
                <button type="button" class="calc-btn btn-op btn-plus"
                    onclick="mostrar(agregarOperador('+'))">+</button>

                <button type="button" class="calc-btn btn-num" onclick="mostrar(agregarNumero('4'))">4</button>
                <button type="button" class="calc-btn btn-num" onclick="mostrar(agregarNumero('5'))">5</button>
                <button type="button" class="calc-btn btn-num" onclick="mostrar(agregarNumero('6'))">6</button>

                <button type="button" class="calc-btn btn-num" onclick="mostrar(agregarNumero('1'))">1</button>
                <button type="button" class="calc-btn btn-num" onclick="mostrar(agregarNumero('2'))">2</button>
                <button type="button" class="calc-btn btn-num" onclick="mostrar(agregarNumero('3'))">3</button>
                <button type="button" class="calc-btn btn-equals" onclick="resolver()">=</button>

                <button type="button" class="calc-btn btn-num btn-zero" onclick="mostrar(agregarNumero('0'))">0</button>
                <button type="button" class="calc-btn btn-num" onclick="mostrar(agregarDecimal())">.</button>
            </div>

        </div>
    </div>

    <script src="input.js"></script>
    <script src="multiplicacion.js"></script>
    <script src="division.js"></script>
    <script src="addition.js"></script>
    <script>
        const pantalla = document.getElementById("display");

        function mostrar(texto) {
            if (texto === "") {
                pantalla.textContent = "0";
                return;
            }
            pantalla.textContent = texto
                .replace(/\*/g, "×")
                .replace(/\//g, "÷")
                .replace(/-/g, "−");

        }

        function resolver() {
            if (obtenerExpresion() === "") return;

            if (!esExpresionValida()) {
                pantalla.textContent = "Syntax Error";
                return;
            }

            try {
                let expr = obtenerExpresion();

                // 1. Resolver paréntesis de adentro hacia afuera
                while (expr.includes("(")) {
                    expr = expr.replace(/\(([^()]+)\)/, (_, contenido) => {
                        contenido = resolverMultiplicacion(contenido);
                        contenido = resolverDivision(contenido);
                        return eval(contenido);
                    });
                }

                // 2. Resolver operaciones restantes fuera de paréntesis
                expr = resolverMultiplicacion(expr);
                expr = resolverDivision(expr);
                expr = resolverSuma(expr);
                const resultado = eval(expr);

                if (isNaN(resultado) || !isFinite(resultado)) {
                    pantalla.textContent = "Error";
                    return;
                }

                establecerExpresion(resultado);
                mostrar(String(resultado));
            } catch (error) {
                pantalla.textContent = "Error";
            }
        }
    </script>

</body>

</html>
